<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Complaint - CampusFix</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>CampusFix</h1><nav><a href="index.html">Home</a><a href="complaint.html">Report Issue</a><a href="status.html">Track Complaint</a><a href="admin.html">Admin</a></nav></header><main class="form-wrap"><h2>Report a Campus Issue</h2><form id="complaintForm"><input id="studentName" placeholder="Student name" required><input id="email" type="email" placeholder="Email" required><select id="category" required><option value="">Select category</option><option>Maintenance</option><option>Cleanliness</option><option>Safe</option><option>IT Support</option><option>Transport</option><option>Other</option></select><input id="title" placeholder="Complaint title" required><textarea id="description" placeholder="Describe the issue" required></textarea><input id="location" placeholder="Location (e.g. Block A, Lab 2)"><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select><button class="btn" type="submit">Submit Complaint</button></form><div id="result"></div></main><script src="javascript/script.js"></script></body></html>
